name: Terraform Infra

on:
  push:
    branches:
      - main
      - dev
    paths:
      - infra-terraform/**
      - .github/workflows/terraform-infra.yml
  workflow_dispatch:
    inputs:
      action:
        description: What do you want to run?
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

env:
  TERRAFORM_FOLDER: infra-terraform/env/prod
  TFVARS_FILE: terraform.tfvars
  STATE_STORAGE_ACCOUNT: stcaseprojecttfstate
  STATE_CONTAINER: tfstate
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    env:
      TF_VAR_admin_password: ${{ secrets.JUMPBOX_ADMIN_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Terraform state container exists
        run: |
          az storage container create \
            --name "$STATE_CONTAINER" \
            --account-name "$STATE_STORAGE_ACCOUNT" \
            --auth-mode login \
            --output none

      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_FOLDER }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TERRAFORM_FOLDER }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TERRAFORM_FOLDER }}
        run: terraform plan -input=false -var-file="$TFVARS_FILE" -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        working-directory: ${{ env.TERRAFORM_FOLDER }}
        run: terraform apply -input=false -auto-approve tfplan
