name: Terraform Infra

on:
  push:
    branches:
      - main
    paths:
      - infra-terraform/**
      - .github/workflows/terraform-infra.yml
  pull_request:
    paths:
      - infra-terraform/**
      - .github/workflows/terraform-infra.yml
  workflow_dispatch:
    inputs:
      action:
        description: Choose whether to generate a plan or apply it
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

env:
  TERRAFORM_FOLDER: infra-terraform/env/prod
  TFVARS_FILE: terraform.tfvars
  BACKEND_RESOURCE_GROUP: rg-backup-state-01
  BACKEND_STORAGE_ACCOUNT: stcaseprojecttfstate
  BACKEND_CONTAINER: tfstate
  BACKEND_KEY: prod.terraform.tfstate

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform init and validate
        working-directory: ${{ env.TERRAFORM_FOLDER }}
        env:
          TF_VAR_admin_password: ${{ secrets.JUMPBOX_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          az storage account show \
            --resource-group "$BACKEND_RESOURCE_GROUP" \
            --name "$BACKEND_STORAGE_ACCOUNT" >/dev/null
          STORAGE_KEY=$(az storage account keys list \
            --resource-group "$BACKEND_RESOURCE_GROUP" \
            --account-name "$BACKEND_STORAGE_ACCOUNT" \
            --query "[0].value" -o tsv)
          az storage container create \
            --name "$BACKEND_CONTAINER" \
            --account-name "$BACKEND_STORAGE_ACCOUNT" \
            --account-key "$STORAGE_KEY" >/dev/null
          terraform init \
            -backend-config="resource_group_name=$BACKEND_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$BACKEND_STORAGE_ACCOUNT" \
            -backend-config="container_name=$BACKEND_CONTAINER" \
            -backend-config="key=$BACKEND_KEY"
          terraform validate

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform plan
        working-directory: ${{ env.TERRAFORM_FOLDER }}
        env:
          TF_VAR_admin_password: ${{ secrets.JUMPBOX_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          az storage account show \
            --resource-group "$BACKEND_RESOURCE_GROUP" \
            --name "$BACKEND_STORAGE_ACCOUNT" >/dev/null
          STORAGE_KEY=$(az storage account keys list \
            --resource-group "$BACKEND_RESOURCE_GROUP" \
            --account-name "$BACKEND_STORAGE_ACCOUNT" \
            --query "[0].value" -o tsv)
          az storage container create \
            --name "$BACKEND_CONTAINER" \
            --account-name "$BACKEND_STORAGE_ACCOUNT" \
            --account-key "$STORAGE_KEY" >/dev/null
          terraform init \
            -backend-config="resource_group_name=$BACKEND_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$BACKEND_STORAGE_ACCOUNT" \
            -backend-config="container_name=$BACKEND_CONTAINER" \
            -backend-config="key=$BACKEND_KEY"
          terraform plan -var-file="$TFVARS_FILE" -out="tfplan"

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TERRAFORM_FOLDER }}/tfplan
          if-no-files-found: error

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform-plan

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform apply
        working-directory: ${{ env.TERRAFORM_FOLDER }}
        env:
          TF_VAR_admin_password: ${{ secrets.JUMPBOX_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          az storage account show \
            --resource-group "$BACKEND_RESOURCE_GROUP" \
            --name "$BACKEND_STORAGE_ACCOUNT" >/dev/null
          STORAGE_KEY=$(az storage account keys list \
            --resource-group "$BACKEND_RESOURCE_GROUP" \
            --account-name "$BACKEND_STORAGE_ACCOUNT" \
            --query "[0].value" -o tsv)
          az storage container create \
            --name "$BACKEND_CONTAINER" \
            --account-name "$BACKEND_STORAGE_ACCOUNT" \
            --account-key "$STORAGE_KEY" >/dev/null
          terraform init \
            -backend-config="resource_group_name=$BACKEND_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$BACKEND_STORAGE_ACCOUNT" \
            -backend-config="container_name=$BACKEND_CONTAINER" \
            -backend-config="key=$BACKEND_KEY"
          terraform apply -auto-approve "$GITHUB_WORKSPACE/terraform-plan/tfplan"
